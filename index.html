        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;

            color: #e0e0e0;
            min-height: 100vh;
        }

        /* Hero / Cover Section */
        .hero {
            position: relative;
            min-height: 50vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px 40px;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(120, 80, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 100, 80, 0.1) 0%, transparent 50%),

        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .logo {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #7c5cff, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }

        .logo-icon {
            display: inline-block;
            margin-right: 10px;
            font-size: 3rem;
            -webkit-text-fill-color: initial;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: #8888aa;
            max-width: 600px;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .hero-badges {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .badge-free {
            background: rgba(78, 205, 196, 0.15);
            color: #4ecdc4;
            border: 1px solid rgba(78, 205, 196, 0.3);
        }

        .badge-pdf {
            background: rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        .badge-official {
            background: rgba(124, 92, 255, 0.15);
            color: #a78bfa;
            border: 1px solid rgba(124, 92, 255, 0.3);
        }

        /* Search Bar */
        .search-container {
            max-width: 600px;
            margin: 0 auto 40px;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        .search-box {
            width: 100%;
            padding: 16px 24px 16px 50px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            font-size: 1rem;
            color: #e0e0e0;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box::placeholder {
            color: #555577;
        }

        .search-box:focus {
            border-color: rgba(124, 92, 255, 0.5);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 30px rgba(124, 92, 255, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            color: #555577;
            font-size: 1.1rem;
        }

        /* Category Tabs */
        .categories {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            padding: 0 20px;
            margin-bottom: 40px;
        }

        .category-tab {
            padding: 10px 22px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #8888aa;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            user-select: none;
        }

        .category-tab:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #bbb;
        }

        .category-tab.active {
            background: rgba(124, 92, 255, 0.15);
            color: #a78bfa;
            border-color: rgba(124, 92, 255, 0.3);
        }

            margin: 0 auto;
            padding: 0 20px 60px;

            font-weight: 700;
            margin-bottom: 24px;
            padding-left: 16px;
            border-left: 3px solid #7c5cff;
            color: #ddd;
        }

        /* Card Grid */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .card {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 28px 24px;
            cursor: pointer;
            transition: all 0.35s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 20px 20px 0 0;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 16px;
        }

        .card-icon {

            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            flex-shrink: 0;

        .card-meta {

        }

        .card-name {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #eee;
        }

        .card-url {
            font-size: 0.78rem;
            color: #666688;
            word-break: break-all;
        }

        .card-desc {
            font-size: 0.88rem;
            color: #8888aa;
            line-height: 1.7;
            flex: 1;
        }

        .card-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .tag {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .tag-pdf {
            background: rgba(255, 107, 107, 0.12);
            color: #ff8a80;
        }

        .tag-free {
            background: rgba(78, 205, 196, 0.12);
            color: #4ecdc4;
        }

            color: #ffc107;
        }

        .tag-en {

            color: #64b5f6;
        }

            background: rgba(124, 92, 255, 0.12);
            color: #a78bfa;
        }

        .tag-academic {
            background: rgba(255, 152, 0, 0.12);
            color: #ffb74d;
        }

        .card.theme-blue::before { background: linear-gradient(90deg, #42a5f5, #64b5f6); }
        .card.theme-blue .card-icon { background: rgba(66, 165, 245, 0.15); color: #64b5f6; }

        .card.theme-orange::before { background: linear-gradient(90deg, #ff9800, #ffb74d); }
        .card.theme-orange .card-icon { background: rgba(255, 152, 0, 0.15); color: #ffb74d; }

        .card.theme-pink::before { background: linear-gradient(90deg, #ec407a, #f48fb1); }
        .card.theme-pink .card-icon { background: rgba(236, 64, 122, 0.15); color: #f48fb1; }

        .card.theme-green::before { background: linear-gradient(90deg, #66bb6a, #a5d6a7); }
        .card.theme-green .card-icon { background: rgba(102, 187, 106, 0.15); color: #a5d6a7; }

        /* Arrow indicator */
        .card-arrow {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 32px;
            height: 32px;

            align-items: center;

            font-size: 0.9rem;
            color: #555;

        .card:hover .card-arrow {

            color: #a78bfa;

        }

        /* Footer */
        .footer {

            padding: 40px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            color: #444466;
            font-size: 0.85rem;
        }

        .footer a {
            color: #7c5cff;

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: rgba(124, 92, 255, 0.3);
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* No results */

            text-align: center;
            padding: 60px 20px;
            color: #555577;
            display: none;
        }

        .no-results-icon {
            font-size: 3rem;
            margin-bottom: 16px;

            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: rgba(124, 92, 255, 0.2);
            border: 1px solid rgba(124, 92, 255, 0.3);
            color: #a78bfa;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            z-index: 100;
            font-size: 1.2rem;
        }

        .back-to-top.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .back-to-top:hover {
            background: rgba(124, 92, 255, 0.35);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo {
                font-size: 2.5rem;
            }

            .hero-subtitle {
                font-size: 1rem;
            }

            .card-grid {
                grid-template-columns: 1fr;
            }

            .hero {
                min-height: 40vh;
                padding: 40px 20px 30px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 2rem;
            }

            }

                font-size: 0.82rem;
            }
        }

</head>

    if (data.length === 0) {
        grid.innerHTML = '';
        noResults.style.display = 'block';
        return;
    }

    noResults.style.display = 'none';

    const tagLabels = {
        'free': '免费',
        'pdf': 'PDF',
        'cn': '中文',
        'en': '英文',
        'tech': '技术',
        'academic': '学术'
    };

    const tagClasses = {
        'free': 'tag-free',
        'pdf': 'tag-pdf',
        'cn': 'tag-cn',
        'en': 'tag-en',
        'tech': 'tag-tech',
        'academic': 'tag-academic'
    };

    grid.innerHTML = data.map(site => `
        <a class="card theme-${site.theme}" href="${site.url}" target="_blank" rel="noopener noreferrer"
           data-categories='${JSON.stringify(site.category)}'>
            <div class="card-arrow">&#8599;</div>
            <div class="card-header">
                <div class="card-icon">${site.icon}</div>
                <div class="card-meta">
                    <div class="card-name">${site.name}</div>
                    <div class="card-url">${site.url.replace('https://', '')}</div>
                </div>
            </div>
            <div class="card-desc">${site.desc}</div>
            <div class="card-tags">
                ${site.tags.map(t => `<span class="tag ${tagClasses[t] || ''}">${tagLabels[t] || t}</span>`).join('')}
            </div>
        </a>
    `).join('');
}

// Initial render
renderCards(sites);

// Search functionality
const searchBox = document.getElementById('searchBox');
let currentCategory = 'all';

function filterSites() {
    const query = searchBox.value.toLowerCase().trim();
    let filtered = sites;

    if (currentCategory !== 'all') {
        filtered = filtered.filter(s => s.category.includes(currentCategory));
    }

    if (query) {
        filtered = filtered.filter(s =>
            s.name.toLowerCase().includes(query) ||
            s.desc.toLowerCase().includes(query) ||
            s.url.toLowerCase().includes(query) ||
            s.tags.some(t => t.includes(query))
        );
    }

    renderCards(filtered);
}

searchBox.addEventListener('input', filterSites);

// Category tabs
document.getElementById('categoryTabs').addEventListener('click', (e) => {
    if (e.target.classList.contains('category-tab')) {
        document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        currentCategory = e.target.dataset.category;
        filterSites();
    }
});

// Floating particles
function createParticles() {
    const container = document.getElementById('particles');
    const colors = [
        'rgba(124, 92, 255, 0.25)',
        'rgba(78, 205, 196, 0.2)',
        'rgba(255, 107, 107, 0.2)',
        'rgba(255, 193, 7, 0.15)'
    ];

    for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.background = colors[Math.floor(Math.random() * colors.length)];
        particle.style.width = (Math.random() * 3 + 1) + 'px';
        particle.style.height = particle.style.width;
        particle.style.animationDuration = (Math.random() * 20 + 15) + 's';
        particle.style.animationDelay = (Math.random() * 20) + 's';
        container.appendChild(particle);
    }
}
createParticles();

// Back to top
const backToTop = document.getElementById('backToTop');
window.addEventListener('scroll', () => {
    if (window.scrollY > 400) {
        backToTop.classList.add('visible');
    } else {
        backToTop.classList.remove('visible');
    }
});

backToTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>

</body>
